name: release

# Publicar es un tag, no una serie de pasos a mano. El pipeline entero —compilar,
# firmar, generar `latest.json`, crear la release y adjuntar los artefactos— pasa
# por acá. Ver `docs/updates.md` para el porqué de cada cosa.

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  # Dos tags pushes juntos no compiten por los mismos artefactos. La segunda
  # corrida espera; no se cancela a la primera a medio publicar.
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Compilar, firmar y publicar
    # Windows y sólo Windows: los targets del bundle son `nsis` y `msi`, y ninguno
    # de los dos se puede construir en otro runner.
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4
        # Historia completa, no un commit suelto: el paso de más abajo decide si
        # este tag es una versión pública preguntando si su commit llegó a `main`,
        # y eso necesita los ancestros, no sólo la punta.
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: 'src-tauri -> target'

      - name: Dependencias del frontend
        run: bun install --frozen-lockfile

      # GitHub no le pone a la corrida el nombre del workflow: en un push de
      # tag le pone **el asunto del commit etiquetado**. Por eso el commit que
      # sube la versión tiene que llamarse como la versión, y este paso es el que
      # lo cobra antes de gastar el runner entero en una build que después nadie
      # descarga. Es el mismo archivo que usa el hook local y el job de CI: la
      # regla está escrita una sola vez.
      - name: El commit etiquetado sigue la convención de mensajes
        id: commit
        shell: pwsh
        run: |
          # El runner es Windows y `sh` no siempre está en el PATH, así que se
          # busca primero y se cae a la ruta que instala Git for Windows.
          $bash = (Get-Command bash -ErrorAction SilentlyContinue).Source
          if (-not $bash) { $bash = Join-Path $env:ProgramFiles 'Git\bin\bash.exe' }
          if (-not (Test-Path $bash)) {
            Write-Host "::error::No encontré bash para correr .githooks/commit-msg."
            exit 1
          }
          # `rev-list` pela el tag anotado hasta su commit: `GITHUB_SHA` puede
          # ser el objeto del tag y no el commit que etiqueta.
          $sha = (git rev-list -n 1 $env:GITHUB_SHA).Trim()
          Write-Host "Commit etiquetado: $sha — $(git log -1 --format=%s $sha)"
          # El commit viaja a la build: es lo que le dice a la app si la release
          # pública es la misma build que está corriendo. Ver `BUILD_COMMIT` en
          # `src-tauri/src/lib.rs`.
          "sha=$sha" >> $env:GITHUB_OUTPUT
          & $bash '.githooks/commit-msg' '--commit' $sha
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # La release se publica desde un tag, así que el tag es la versión. Si no
      # coinciden con el manifiesto, `latest.json` va a prometer un archivo que la
      # app instalada nunca va a pedir, y el comprobador queda mudo para siempre.
      - name: La etiqueta tiene que coincidir con la versión
        shell: pwsh
        run: |
          $conf = Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json
          $tag = $env:GITHUB_REF_NAME
          if ($tag -ne "v$($conf.version)") {
            Write-Host "::error::El tag es '$tag' y src-tauri/tauri.conf.json dice '$($conf.version)'."
            Write-Host "::error::Corré 'bun run version:set $($conf.version)' y armá el tag sobre ese commit."
            exit 1
          }
          Write-Host "Publicando $tag"

      # Las notas de la release son el changelog, y salen de ahí.
      #
      # Con `generateReleaseNotes` GitHub escribe el cuerpo de la release: una
      # lista de commits y una sección de "nuevo contribuidor" —que en un repo
      # de una sola persona es el dueño de la app, dicho como si fuera otra
      # persona—. Las notas de una versión están escritas: están en CHANGELOG.md,
      # y la 0.3.0 las tenía. Lo que se publica sale de ese archivo.
      #
      # La sección se busca por la versión del manifiesto, que es la del tag por
      # el paso de arriba: un tag y un changelog que no hablan de lo mismo es un
      # error, y sale con error en vez de publicar unas notas de otra versión.
      #
      # La búsqueda está en `scripts/releases.ts`, que es el mismo archivo que
      # arregla las releases ya publicadas: la regla de qué son las notas de una
      # versión está escrita una sola vez, y no una acá y otra en el script.
      - name: Las notas de la release son el changelog
        id: notas
        shell: pwsh
        run: |
          $body = bun scripts/releases.ts notes
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          # El heredoc se escribe a mano, con LF y sin BOM. La redirección de
          # PowerShell escribe CRLF, y las notas tienen que ser el texto del
          # changelog tal cual: el paso del final compara el cuerpo de la
          # release y el `notes` del manifest contra el changelog, y con CRLF la
          # comparación falla siempre —y ese paso es el que frena la publicación.
          $notas = ($body -join "`n") + "`n"
          $salida = "body<<NOTAS_EOF`n" + $notas + "NOTAS_EOF`n"
          [System.IO.File]::AppendAllText(
            $env:GITHUB_OUTPUT,
            $salida,
            [System.Text.UTF8Encoding]::new($false)
          )
          # `${version}` y no `$version`: un dos puntos pegado a un nombre de
          # variable lo convierte en un nombre calificado y el script entero deja
          # de parsear. El runner se entera con un error de sintaxis, en el
          # paso que publica la release.
          $version = (Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          $joined = $body -join "`n"
          Write-Host "Notas de ${version}: $($joined.Length) caracteres"

      # Un tag no tiene por qué ser un commit sano. Son los mismos chequeos que el
      # repo pide antes de un PR, y cortan la publicación: una build que compila no
      # es una build para entregar a alguien.
      - name: Lint, tipos y tests
        shell: pwsh
        run: |
          bun run lint
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          bun run typecheck
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          bun run version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Push-Location src-tauri
          cargo test --lib
          if ($LASTEXITCODE -ne 0) { Pop-Location; exit $LASTEXITCODE }
          Pop-Location

      # Las releases que ya están publicadas quedan en la misma forma que va a
      # quedar esta: los mismos tres archivos, con el mismo nombre, y el cuerpo
      # tomado del changelog.
      #
      # Va **antes** de publicar a propósito: si algo falla acá, la release
      # nueva ni se crea, y un error después de crearla deja un borrador a
      # medio hacer. Y el paso es idempotente: una release que ya está en forma
      # no se toca, así que correrlo en cada release no gasta nada.
      #
      # El token es el de la CI, que ya tiene permiso de escritura sobre las
      # releases: esto no necesita una sesión de `gh` en la máquina de nadie.
      #
      # **El paso no corta la publicación.** Arreglar las releases viejas es
      # housekeeping, y hay dos cosas que pueden fallar sin que la release de
      # hoy sea inválida: el `GITHUB_TOKEN` de la CI puede no tener permiso
      # sobre los archivos que subió otra corrida, y la red puede caerse. Lo que
      # se publica hoy lo valida el paso del final, que sí es bloqueante.
      - name: Las releases viejas quedan en forma
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          bun scripts/releases.ts sync
          if ($LASTEXITCODE -ne 0) {
            Write-Host "::warning::No se pudieron dejar en forma todas las releases viejas."
            Write-Host "::warning::Las de esta corrida no dependen de esto: el paso final las valida."
          }
          exit 0

      # Una release de `develop` es una build de prueba. La diferencia no está en
      # cómo se compila sino en cómo se publica: GitHub no redirige
      # `releases/latest` hacia una prerelease, así que marcar la release como tal
      # es lo que hace que una app instalada nunca se entere de que existe.
      #
      # El tag es el disparador siempre; lo que decide si es pública es de qué rama
      # salió. La pregunta se invierte a propósito —"¿está en `main`?"— para que
      # un tag desde cualquier otro lado caiga en prerelease y no en una release
      # pública por descuido. Un tag desde una rama cualquiera es un error, y el
      # costo de equivocarse sale del lado de la seguridad.
      - name: ¿Esta release es pública?
        id: canal
        shell: pwsh
        run: |
          git merge-base --is-ancestor $env:GITHUB_SHA origin/main
          $enMain = ($LASTEXITCODE -eq 0)
          if ($enMain) {
            Write-Host "El tag llegó a main: release normal."
            "prerelease=false" >> $env:GITHUB_OUTPUT
            "desdeMain=true" >> $env:GITHUB_OUTPUT
          } else {
            Write-Host "El tag no llegó a main: release como prerelease, invisible para la app instalada."
            "prerelease=true" >> $env:GITHUB_OUTPUT
            "desdeMain=false" >> $env:GITHUB_OUTPUT
          }
          # Este `exit 0` no es una formalidad. El shell `pwsh` de los runners
          # cierra cada paso con `exit $LASTEXITCODE`, y después del `merge-base`
          # ese valor sigue siendo el de git: el paso se colgaba con el código de
          # la respuesta que él mismo acababa de interpretar. Como la rama de
          # prerelease es justamente la que devuelve 1, este paso nunca pasó por
          # ese lado — la 0.4.0 murió acá, después de pasar lint, tipos y tests.
          #
          # Un `origin/main` que no exista devuelve 128 y cae en la misma rama de
          # prerelease, que es el lado que falla sin hacer daño: una release de
          # prueba en vez de una pública.
          exit 0

      # Hace las cuatro cosas juntas: compila, firma con la clave de los secretos,
      # crea la release y sube los artefactos —los instaladores, los `.sig` y el
      # `latest.json`— con las URLs ya apuntando a esta release.
      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # La misma clave que está en tu `.secrets/starless-updater.key`. La
          # pública va embebida en cada instalador que ya está dando vueltas, así
          # que una clave nueva los dejaría sin poder actualizarse nunca más.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # El canal de la build, que es la misma pregunta que la del ícono: de
          # dónde salió el tag. La app lo muestra al lado de la versión en
          # Ajustes, para que "esta es una pre-release" se lea y no se deduzca
          # del ícono invertido.
          STARLESS_CHANNEL: ${{ steps.canal.outputs.desdeMain == 'false' && 'develop' || 'release' }}
          # El commit de esta build, para que la app sepa si la release pública
          # es la misma build que está corriendo: una release pública con una
          # build de `develop` adentro hace que la app se ofrezca a sí misma,
          # y ese bucle no termina. Ver `BUILD_COMMIT` en
          # `src-tauri/src/lib.rs`.
          STARLESS_COMMIT: ${{ steps.commit.outputs.sha }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'Starless ${{ github.ref_name }}'
          # Borrador a propósito: `releases/latest/download/latest.json` es la
          # dirección que consulta la app instalada, y GitHub no redirecciona a
          # borradores. Publicar a mano es el paso que hace pública la release
          # recién cuando los archivos ya están arriba, en vez de unos segundos
          # antes.
          releaseDraft: true
          # Lo decide el paso de arriba, no el archivo: una release salida de
          # `develop` se marca prerelease y la app instalada no la ve nunca.
          prerelease: ${{ steps.canal.outputs.prerelease }}
          # Las notas las trae el paso de arriba, del changelog. La generación
          # automática se apaga a propósito: `releaseBody` se **antepone** a lo
          # que GitHub genera, así que dejarla prendida pondría las notas
          # reales arriba y abajo el "nuevo contribuidor" que GitHub decide.
          releaseBody: ${{ steps.notas.outputs.body }}
          generateReleaseNotes: false
          # Se dice explícito para que el default del action no pueda cambiarnos
          # la URL del actualizador sin que lo notemos.
          uploadUpdaterJson: true
          uploadUpdaterSignatures: true
          tauriScript: bun tauri
          # El nombre del archivo, sin el idioma.
          #
          # El bundler de Tauri localize el MSI, así que el archivo sale como
          # `Starless_0.5.4_x64_en-US.msi` y ése es el nombre que aparece en la
          # página de la release. El idioma no se puede sacar de la configuración
          # —el nombre lo arma el bundler—, pero sí del archivo que se sube: el
          # pattern de abajo le pone el nombre limpio al subirlo.
          #
          # Renombrar no rompe nada: el manifest apunta al asset **por id**, y
          # renombrar un asset en GitHub no cambia su id. La firma tampoco: cubre
          # el contenido del archivo, no su nombre.
          releaseAssetNamePattern: "[name]_[version]_x64[ext]"
          # El ícono de `develop` vive en `src-tauri/tauri.dev.conf.json`, y
          # `bun run app` lo pasa por `--config`. La build del runner no lo pasaba, así que
          # toda release publicada llevaba el ícono de producción y una prerelease
          # se veía exactamente igual que la app de verdad. Es el mismo archivo que
          # ya usa la máquina de quien la desarrolla.
          #
          # La expresión pone la cadena vacía del lado del `||` a propósito: en
          # `a && 'x' || ''` el `''` es falsy y el resultado termina siendo el
          # otro lado igual. Así el orden es el correcto sin tener que pensarlo.
          args: ${{ steps.canal.outputs.desdeMain == 'false' && '--config src-tauri/tauri.dev.conf.json' || '' }}

      # La release recién creada tiene que tener la forma que la app y el
      # actualizador esperan: tres archivos, con el nombre que la gente busca, y
      # un manifest que apunta al instalador y no a un archivo que ya no está.
      #
      # La release queda en borrador, así que este paso es el último que puede
      # frenarla. Publicarla a mano es un acto de fe; esto es la prueba de que
      # lo que se va a publicar sirve.
      #
      # La lista de archivos no está escrita acá: está en `scripts/releases.ts`,
      # que es el mismo que usa el que arregla las releases viejas. Una regla
      # escrita dos veces es una regla que sooner o later son dos.
      - name: La release tiene la forma que corresponde
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          bun scripts/releases.ts check ${{ github.ref_name }}
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
