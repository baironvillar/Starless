name: Landing

on:
  push:
    # Sólo `main`: la landing ofrece la release pública, y `main` es lo que ya
    # salió. Publicarla desde `develop` mostraría texto de algo que todavía no
    # se puede descargar.
    branches: [main]
    paths: ["site/**", ".github/workflows/landing.yml"]
  workflow_dispatch:

concurrency:
  group: landing
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Publish the landing to Cloudflare
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Build
        working-directory: site
        run: bun install --frozen-lockfile && bun run build
      # El token y la cuenta son secretos del repo (ver docs/landing-hosting.md).
      # El token sólo puede editar Workers: no es la sesión de nadie.
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: site
          command: deploy
