name: CI

on:
  push:
    # `develop` está acá porque es donde vive el trabajo todos los días: cada
    # PR que se mergea ahí es un push a esa rama. Dejar el CI sólo para `main` y
    # pull requests hacía que la mitad de los checks de este archivo nunca se
    # ejecutaran. Nadie empuja directo a `develop` ni a `main`; ver
    # CONTRIBUTING.md#branches-and-pull-requests.
    branches: [main, develop]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Lint, typecheck, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Cache bun dependencies
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-

      - name: Install
        run: bun install --frozen-lockfile

      - name: Lint and format
        run: bun run lint

      - name: Typecheck
        run: bun run typecheck

      - name: Build
        run: bun run build

  version:
    name: Version consistency
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # The version lives in tauri.conf.json and is propagated to Cargo.toml
      # and package.json by scripts/version.ts, which exits non-zero when the
      # three disagree. This job exists so that a PR touching one manifest and
      # not the others fails here instead of shipping a build that lies about
      # its own version.
      - name: Check all three manifests agree
        run: bun run version

  messages:
    name: Commit messages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # El chequeo recorre un rango de commits, no sólo la punta: con la
          # historia shallow el rango no existe y el job no miraría nada.
          fetch-depth: 0

      # El hook local frena el mensaje antes de que el commit exista, pero el
      # hook vive en el clon y no en el repositorio: un commit hecho con
      # `--no-verify`, o en una máquina donde `bun run hooks:install` nunca se
      # corrió, llegaría acá sin que nadie lo mire. La regla está escrita una
      # sola vez, en `.githooks/commit-msg`, y este job corre ese mismo archivo.
      - name: Every commit in this push follows the convention
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base='${{ github.event.pull_request.base.sha }}'
            head='${{ github.event.pull_request.head.sha }}'
          else
            base='${{ github.event.before }}'
            head='${{ github.sha }}'
          fi
          # La regla no gobierna la historia que ya estaba escrita cuando entró.
          # `--not` saca del rango el commit que agregó el hook y todo lo que es
          # ancestro suyo, que es exactamente lo anterior a la regla: un PR que
          # lleva a `main` los commits viejos de `develop` no está rompiendo
          # ninguna regla, está trayendo la historia que ya estaba. Sin esto, el
          # primer merge después de adoptarla fallaba siempre.
          #
          # `--diff-filter=A` lo ancla en el commit que *agregó* el archivo, no
          # en el último que lo tocó: cambiar la regla no reinicia el reloj.
          regla=$(git log --diff-filter=A -1 --format=%H -- .githooks/commit-msg 2>/dev/null || true)
          if [ -n "$regla" ]; then
            corte="--not $regla"
          else
            corte=""
          fi
          # El primer push de una rama tiene un `before` de ceros, y una rama
          # recreada, rebased o force-pushed deja un `base` que no está en este
          # clon. Recorrer toda la historia en ese caso bloquearía todos los
          # pushes para siempre por commits que nadie puede reescribir, así que
          # en ese caso se mira lo que hay desde la regla hasta la punta.
          #
          # Y un rango con una base que no existe no se puede recorrer: `git
          # rev-list` aborta, y en un runner un `abort` es un paso rojo. Por eso
          # la base se cambia por la punta en vez de dejarse rota —un force-push
          # es un push como cualquier otro y no puede dejar el CI en rojo—.
          if printf '%s' "$base" | grep -qE '^0+$' || ! git cat-file -e "$base^{commit}" 2>/dev/null; then
            shas=$(git rev-list "$head" $corte)
          else
            shas=$(git rev-list "$base..$head" $corte)
          fi
          if [ -z "$shas" ]; then
            echo "No hay commits nuevos que mirar."
            exit 0
          fi
          for sha in $shas; do
            echo "checking $sha — $(git log -1 --format=%s "$sha")"
            # El `exit` va explícito porque dentro de un `for` el fallo depende
            # de que el shell venga con `-e`, y este bloque se puede correr a
            # mano para probarlo: un check que avisa y después sigue no cortó nada.
            sh .githooks/commit-msg --commit "$sha" || exit 1
          done
          echo "Checked $(printf '%s\n' $shas | wc -l) commit(s)."

  branch:
    name: Branch name
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The pre-push hook stops a badly named branch before it leaves the
      # machine, but like the commit-message hook it lives in the clone: this
      # job runs the same file, so `--no-verify` skips it locally and not here.
      # The names travel through `env` and not `${{ }}` inside the script,
      # because a branch name is text the author of the PR chose.
      - name: The branch follows the convention and targets the right base
        env:
          HEAD_REF: ${{ github.head_ref }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          if [ "$BASE_REF" = "main" ]; then
            if [ "$HEAD_REF" != "develop" ]; then
              echo "::error::main only receives develop; open this PR against develop"
              exit 1
            fi
            echo "develop -> main"
            exit 0
          fi
          if [ "$BASE_REF" != "develop" ]; then
            echo "::error::pull requests target develop, not $BASE_REF"
            exit 1
          fi
          sh .githooks/pre-push --branch "$HEAD_REF"
          echo "$HEAD_REF -> develop"

  secrets:
    name: No private keys committed
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The updater signing key can sign an update for every installed copy of
      # Starless. It belongs in a CI secret, never in a repository, and
      # regenerating it would strand every install that already trusts the old
      # public half. Cheap to check, expensive to discover late.
      - name: Guard
        run: |
          if git ls-files --error-unmatch .secrets >/dev/null 2>&1; then
            echo "::error::.secrets is tracked in this repository"
            exit 1
          fi
          if git ls-files | grep -qE 'starless-updater\.key'; then
            echo "::error::an updater private key is tracked in this repository"
            exit 1
          fi
          echo "No private keys tracked."
