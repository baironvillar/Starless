name: CI

on:
  push:
    # `develop` está acá porque es donde vive el trabajo todos los días, y un
    # push directo a esa rama es la forma normal de publicar aquí. Dejar el CI
    # sólo para `main` y pull requests hacía que la mitad de los checks de este
    # archivo nunca se ejecutaran.
    branches: [main, develop]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Lint, typecheck, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Cache bun dependencies
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-

      - name: Install
        run: bun install --frozen-lockfile

      - name: Lint and format
        run: bun run lint

      - name: Typecheck
        run: bun run typecheck

      - name: Build
        run: bun run build

  version:
    name: Version consistency
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # The version lives in tauri.conf.json and is propagated to Cargo.toml
      # and package.json by scripts/version.ts, which exits non-zero when the
      # three disagree. This job exists so that a PR touching one manifest and
      # not the others fails here instead of shipping a build that lies about
      # its own version.
      - name: Check all three manifests agree
        run: bun run version

  messages:
    name: Commit messages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # El chequeo recorre un rango de commits, no sólo la punta: con la
          # historia shallow el rango no existe y el job no miraría nada.
          fetch-depth: 0

      # El hook local frena el mensaje antes de que el commit exista, pero el
      # hook vive en el clon y no en el repositorio: un commit hecho con
      # `--no-verify`, o en una máquina donde `bun run hooks:install` nunca se
      # corrió, llegaría acá sin que nadie lo mire. La regla está escrita una
      # sola vez, en `.githooks/commit-msg`, y este job corre ese mismo archivo.
      - name: Every commit in this push follows the convention
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base='${{ github.event.pull_request.base.sha }}'
            head='${{ github.event.pull_request.head.sha }}'
          else
            base='${{ github.event.before }}'
            head='${{ github.sha }}'
          fi
          # El primer push de una rama tiene un `before` de ceros, y una rama
          # recreada o rebased puede dejar un `base` que no está en este clon.
          # Recorrer toda la historia en ese caso bloquearía todos los pushes
          # para siempre por commits que nadie puede reescribir, así que en ese
          # caso se mira sólo la punta.
          if printf '%s' "$base" | grep -qE '^0+$' || ! git cat-file -e "$base^{commit}" 2>/dev/null; then
            shas="$head"
          else
            shas=$(git rev-list "$base..$head")
          fi
          for sha in $shas; do
            echo "checking $sha — $(git log -1 --format=%s "$sha")"
            # El `exit` va explícito porque dentro de un `for` el fallo depende
            # de que el shell venga con `-e`, y este bloque se puede correr a
            # mano para probarlo: un check que avisa y después sigue no cortó nada.
            sh .githooks/commit-msg --commit "$sha" || exit 1
          done
          echo "Checked $(printf '%s\n' $shas | wc -l) commit(s)."

  secrets:
    name: No private keys committed
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The updater signing key can sign an update for every installed copy of
      # Starless. It belongs in a CI secret, never in a repository, and
      # regenerating it would strand every install that already trusts the old
      # public half. Cheap to check, expensive to discover late.
      - name: Guard
        run: |
          if git ls-files --error-unmatch .secrets >/dev/null 2>&1; then
            echo "::error::.secrets is tracked in this repository"
            exit 1
          fi
          if git ls-files | grep -qE 'starless-updater\.key'; then
            echo "::error::an updater private key is tracked in this repository"
            exit 1
          fi
          echo "No private keys tracked."
