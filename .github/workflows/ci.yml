name: CI

on:
  push:
    # `develop` está acá porque es donde vive el trabajo todos los días: cada
    # PR que se mergea ahí es un push a esa rama. Dejar el CI sólo para `main` y
    # pull requests hacía que la mitad de los checks de este archivo nunca se
    # ejecutaran. Nadie empuja directo a `develop` ni a `main`; ver
    # CONTRIBUTING.md#branches-and-pull-requests.
    branches: [main, develop]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Lint, typecheck, tests, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Cache bun dependencies
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-

      - name: Install
        run: bun install --frozen-lockfile

      - name: Lint and format
        run: bun run lint

      - name: Typecheck
        run: bun run typecheck

      # The relay is the code that files the reports, and it runs on somebody
      # else's server: a bug in it loses a crash report, and the app's answer
      # to that is to open the browser, so the failure looks like a slower
      # app and not like a broken relay. Its tests were written and then
      # nobody ran them, because there was no job that ran them.
      #
      # The queue is the same kind of thing: the rules that decide what plays
      # next are pure functions in `src/lib/queue.ts`, and a rule nobody checks
      # is a rule that breaks in a release. One job runs both — the relay's
      # tests and the app's — because a test that no job runs is a test that
      # breaks alone.
      - name: Tests
        run: bun run test

      - name: Build
        run: bun run build

  version:
    name: Version consistency
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install --frozen-lockfile

      # The version lives in four manifests: package.json, tauri.conf.json,
      # Cargo.toml and Cargo.lock. star (`bun run version`) exits non-zero when
      # they disagree, so a PR touching one and not the others fails here
      # instead of shipping a build that lies about its own version.
      - name: All four manifests agree
        run: bun run version

  messages:
    name: Commit messages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # El chequeo recorre un rango de commits, no sólo la punta: con la
          # historia shallow el rango no existe y el job no miraría nada.
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install --frozen-lockfile

      # El hook local frena el mensaje antes de que el commit exista, pero vive
      # en el clon: un commit hecho con `--no-verify` llegaría acá sin que nadie
      # lo mire. La regla es la de star, la misma que corre el hook. Si la base
      # no está en el clon (primer push, force-push), star mira la punta.
      #
      # Los cuatro commits viejos que rompían la regla (`0.6.0 #48`, …) ya
      # llegaron a `main`, así que ningún rango nuevo los incluye. Si hiciera
      # falta, van en "star": { "lint": { "skip": [...] } } de package.json.
      - name: Every commit in this push follows the convention
        run: bunx star lint commits "$BASE_SHA..$HEAD_SHA"
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

  branch:
    name: Branch name
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install --frozen-lockfile

      # Like the commit-message hook, the pre-push hook lives in the clone:
      # this job runs the same rule, so `--no-verify` skips it locally and not
      # here. A PR goes to develop, and main only receives develop. The names
      # travel through `env` and not `${{ }}` inside the script, because a
      # branch name is text the author of the PR chose.
      - name: The branch follows the convention and targets the right base
        run: bunx star lint branch "$HEAD_REF" --into "$BASE_REF"
        env:
          HEAD_REF: ${{ github.head_ref }}
          BASE_REF: ${{ github.base_ref }}

  secrets:
    name: No private keys committed
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The updater signing key can sign an update for every installed copy of
      # Starless. It belongs in a CI secret, never in a repository, and
      # regenerating it would strand every install that already trusts the old
      # public half. Cheap to check, expensive to discover late.
      - name: Guard
        run: |
          if git ls-files --error-unmatch .secrets >/dev/null 2>&1; then
            echo "::error::.secrets is tracked in this repository"
            exit 1
          fi
          if git ls-files | grep -qE 'starless-updater\.key'; then
            echo "::error::an updater private key is tracked in this repository"
            exit 1
          fi
          echo "No private keys tracked."
