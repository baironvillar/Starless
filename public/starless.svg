<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Starless">
  <title>Starless</title>
  <defs>
    <!-- The dissolve. Holds full opacity across the left points and lets the
         right-hand ones go, which is the whole idea of the name. -->
    <linearGradient id="fade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="14%" stop-color="#C9F73C" stop-opacity="1" />
      <stop offset="90%" stop-color="#C9F73C" stop-opacity="0" />
    </linearGradient>
    <mask id="fadeMask">
      <rect width="64" height="64" fill="url(#fade)" />
    </mask>
  </defs>
  <path d="M32.00 6.40 L37.75 24.09 L56.35 24.09 L41.30 35.02 L47.05 52.71 L32.00 41.78 L16.95 52.71 L22.70 35.02 L7.65 24.09 L26.25 24.09 Z" fill="#C9F73C" mask="url(#fadeMask)" />
</svg>
