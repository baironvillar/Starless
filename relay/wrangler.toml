# The report relay. Deploy steps: relay/README.md.

# The name is part of the Worker's address, and the address is compiled into each
# build through `STAR_MUSIC_REPORT_RELAY`: renaming it is a redeploy and a new
# value for that variable.
name = "star-music-relay"
main = "src/index.ts"
compatibility_date = "2026-10-01"

[vars]
REPO = "Starless-org/StarMusic"
# Reports per address per hour.
RATE_LIMIT = "10"

# Created with `bunx wrangler kv namespace create REPORTS`. Paste the id it prints.
[[kv_namespaces]]
binding = "REPORTS"
id = "38097c0ffd104e69b19d711da7f19f1f"

# GITHUB_TOKEN is a secret, never in this file: `bunx wrangler secret put GITHUB_TOKEN`.
