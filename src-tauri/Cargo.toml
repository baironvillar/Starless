[package]
name = "starless"
version = "0.4.0"
description = "A native desktop client for Spotify"
authors = ["bairo"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "starless_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
# One Starless at a time. Two copies means two streaming sessions on one account,
# and that is not a cosmetic duplicate: they compete for the same audio keys and
# the loser feeds the other one's ciphertext to the decoder.
tauri-plugin-single-instance = "2"
# Updates for people who already have Starless installed. See `docs/updates.md`
# for the release flow and for why the updater signature is not optional.
tauri-plugin-updater = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# librespot, split per concern rather than the single umbrella crate, so a
# breakage in one area is patched in one file.
#
# The audio backend is pinned explicitly: `rodio-backend` routes through cpal to
# WASAPI on Windows, which is the only reason we are here. The default feature
# set also drags in the ALSA backend, which is dead weight on this platform.
librespot-core = "0.8"
librespot-metadata = "0.8"
librespot-playback = { version = "0.8", default-features = false, features = [
    "rodio-backend",
] }
librespot-connect = "0.8"
librespot-oauth = "0.8"
# For the `playlist4_external` messages themselves. Named directly because
# `spclient` decodes them by hand: the library response is a protobuf, not the
# JSON the Web API speaks, and reading one means holding its type.
librespot-protocol = "0.8"
# `parse_from_bytes` lives on this trait, not on the generated type. Without it in
# scope the decoder exists and the compiler says it does not.
protobuf = "3"

# Where the librespot credential cache lives. Resolved once, at startup.
dirs = "6"

# The one place Starless talks to an HTTP API: opening a GitHub issue, and only
# when the person holding the app pressed the button. Blocking client, because
# every caller is already inside `spawn_blocking` — a blocking client cannot be
# built inside an async runtime. `urlencoding` builds the report URL handed back
# when no signing token is compiled in.
reqwest = { version = "0.12", features = ["blocking", "json"] }
urlencoding = "2"
# Scrubbing a log before it leaves the machine. Already in the tree through Tauri,
# so naming it directly costs no extra build time.
regex = "1"

# librespot logs through the `log` crate. Without a logger installed, every
# reason it has for refusing a track is silently discarded — which is exactly
# what happened the first time a track came back `unavailable`.
env_logger = "0.11"
log = "0.4"


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
