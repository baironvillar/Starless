[package]
name = "starless"
version = "0.6.0"
description = "A native desktop client for Spotify"
authors = ["bairo"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "starless_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# `tray-icon` for the icon in the notification area (`tray.rs`).
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# librespot, split per concern rather than the single umbrella crate, so a
# breakage in one area is patched in one file.
#
# The audio backend is pinned explicitly: `rodio-backend` routes through cpal to
# WASAPI on Windows, which is the only reason we are here. The default feature
# set also drags in the ALSA backend, which is dead weight on this platform.
#
# **No default features, because the default is a TLS stack.** Every librespot
# crate defaults to `native-tls`, which is schannel on Windows and OpenSSL on
# Android — and there is no OpenSSL built for a phone. The TLS feature is named
# per platform at the bottom of this file. See `docs/android.md`.
librespot-core = { version = "0.8", default-features = false }
librespot-metadata = { version = "0.8", default-features = false }
librespot-playback = { version = "0.8", default-features = false, features = [
    "rodio-backend",
] }
librespot-connect = { version = "0.8", default-features = false }
# For the `playlist4_external` messages themselves. Named directly because
# `spclient` decodes them by hand: the library response is a protobuf, not the
# JSON the Web API speaks, and reading one means holding its type.
librespot-protocol = "0.8"
# `parse_from_bytes` lives on this trait, not on the generated type. Without it in
# scope the decoder exists and the compiler says it does not.
protobuf = "3"
# Las tandas de metadata de una playlist, a la vez. Ya está en el árbol por
# librespot, así que nombrarla no cuesta compilación.
futures-util = "0.3"

# La voz del DJ: el audio llega del servicio de Spotify y hay que decodificarlo
# a PCM antes de que pueda entrar al mismo stream que la música.
#
# Las tres ya están en el árbol por librespot —`rodio` y `cpal` por el backend
# de audio, `symphonia` por los archivos locales—, así que nombrarlas acá no
# cuesta ni un segundo de compilación: sólo deja de ser un accidente del
# backend lo que la voz usa para sonar.
rodio = "0.21"
cpal = "0.16"
symphonia = { version = "0.5", features = ["mp3"] }

# Where the librespot credential cache lives. Resolved once, at startup.
dirs = "6"

# The one place Starless talks to an HTTP API: opening a GitHub issue, and only
# when the person holding the app pressed the button. Blocking client, because
# every caller is already inside `spawn_blocking` — a blocking client cannot be
# built inside an async runtime. `urlencoding` builds the report URL handed back
# when no signing token is compiled in.
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json"] }
urlencoding = "2"
# Scrubbing a log before it leaves the machine. Already in the tree through Tauri,
# so naming it directly costs no extra build time.
regex = "1"

# librespot logs through the `log` crate. Without a logger installed, every
# reason it has for refusing a track is silently discarded — which is exactly
# what happened the first time a track came back `unavailable`.
env_logger = "0.11"
log = "0.4"

# The media keys and Windows' "now playing" card (`media_keys.rs`). The same
# major version Tauri already pulls in, so this only turns on the WinRT media
# namespaces instead of adding a second copy of the crate.
[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Foundation",
    "Media",
    "Media_Playback",
    "Storage_Streams",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_Kernel",
    "Win32_System_Registry",
    "Win32_UI_Shell",
] }

# What only a desktop has. On a phone the system already keeps one process per
# app and installs the updates, and the single-instance crate compiles empty
# there. The TLS is the one Starless has always used: schannel on Windows.
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
# One Starless at a time. Two copies means two streaming sessions on one account,
# and that is not a cosmetic duplicate: they compete for the same audio keys and
# the loser feeds the other one's ciphertext to the decoder.
tauri-plugin-single-instance = "2"
# Updates for people who already have Starless installed. See `docs/updates.md`
# for the release flow and for why the updater signature is not optional.
tauri-plugin-updater = "2"
librespot-core = { version = "0.8", default-features = false, features = ["native-tls"] }
# The browser login. Desktop only: it opens the browser through the `open`
# crate, which does not know Android — the phone builds its own (`auth.rs`).
librespot-oauth = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["default-tls"] }

# Android: TLS without OpenSSL, and the pieces of the browser login that
# `librespot-oauth` cannot do there. The roots are compiled in (`webpki`) and do
# not depend on where the phone keeps its certificates. All of these are already
# in the tree through librespot and Tauri.
[target.'cfg(target_os = "android")'.dependencies]
librespot-core = { version = "0.8", default-features = false, features = [
    "rustls-tls-webpki-roots",
] }
reqwest = { version = "0.12", default-features = false, features = [
    "rustls-tls-webpki-roots",
] }
base64 = "0.22"
rand = "0.9"
sha2 = "0.10"
url = "2"

# librespot-core 0.8.0 with four places changed, all marked `Starless:`. On
# Android it asked Spotify for its tokens as an Android client, with a client id
# the session does not carry: the client token came behind a hash cash the crate
# cannot solve and login5 refused the rest, so the session connected and the
# library could not be read. Now Android asks as Windows does, and says so in
# every HTTP request too (User-Agent and version) — the DJ answered 500 to an
# Android User-Agent carrying a Windows token. The handshake stays Linux ARM:
# Windows on ARM there would be `PLATFORM_WINDOWS_CE_ARM`, never measured. The
# Windows and macOS paths are byte for byte the published crate. Bumping
# librespot means copying the new version here and carrying the changes over.
[patch.crates-io]
librespot-core = { path = "vendor/librespot-core" }

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
# `panic = "abort"` was here, and it was a lie the app could not afford.
#
# The audio thread opens the output device with a bare `unwrap()`: a device
# that is not there takes the thread down. That is survivable — the thread
# dies, `is_invalid()` says so, and the app tells the user that the device
# could not be opened. But with `abort` a panic anywhere is the end of the
# process, so the same missing device killed the whole app instead of one
# feature of it. The app's own error handling (`audio_device_failed`) assumed
# the opposite, and it was dead code in every release build.
#
# `unwind` costs a few hundred kilobytes and buys the difference between
# "the sound stopped" and "the app is gone". For a player, that is the whole
# product.
panic = "unwind"
strip = true
